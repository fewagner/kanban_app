# Deploys the kanban app to GitHub Pages:
#   main branch -> https://<host>/kanban_app/        (production)
#   beta branch -> https://<host>/kanban_app/beta/   (test channel)
#
# Requires the repo's Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Source), and — once the beta branch exists —
# `beta` added under Settings -> Environments -> github-pages ->
# "Deployment branches and tags". The concurrency group cancels superseded
# deploys instead of letting them race (the cause of sporadic
# "Deployment failed, try again later" errors).
#
# Each channel loads its js/ and css/ from v/<commit>/ (pin_assets below), so
# a deploy never reuses an asset URL that a browser or the CDN may still hold
# from an earlier one — see "Cache busting" in docs/RELEASING.md.
#
# GitHub runs the pushed branch's copy of this file, and every run builds both
# channels: keep beta's copy in step with main's.

name: Deploy Pages (main + beta)

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout beta (ok if the branch does not exist)
        id: beta
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: beta
          path: beta

      - name: Assemble site
        run: |
          # pin_assets <dir> <checkout>: copy <dir>'s js/ and css/ to
          # v/<commit>/ and point index.html there. The modules import each
          # other by relative path, so they all load from that folder too.
          pin_assets() {
            v=$(git -C "$2" rev-parse --short=12 HEAD)
            mkdir -p "$1/v/$v"
            cp -R "$1/js" "$1/css" "$1/v/$v/"
            V=$v perl -pi -e 's#\b(src|href)="(js|css)/#$1="v/$ENV{V}/$2/#g' "$1/index.html"
            grep -q "src=\"v/$v/js/app.js\"" "$1/index.html" &&
              grep -q "href=\"v/$v/css/style.css\"" "$1/index.html" || {
              echo "::error::$1/index.html: found no src=\"js/app.js\" or href=\"css/style.css\" to pin"
              exit 1
            }
          }

          mkdir site
          cp -R main/* site/
          rm -rf site/.github site/tests site/package.json
          touch site/.nojekyll
          pin_assets site main
          if [ -f beta/index.html ]; then
            mkdir -p site/beta
            cp -R beta/* site/beta/
            rm -rf site/beta/.github site/beta/tests site/beta/package.json
            pin_assets site/beta beta
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
